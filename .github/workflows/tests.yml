name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: PowerShell wrapper smoke test
        shell: pwsh
        run: |
          ./scripts/ticalc.ps1 info tests/data/Actual.tns
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/ticalc.ps1 info missing.tns 2>$null
          if ($LASTEXITCODE -ne 1) { throw 'expected exit code 1 for a missing file' }
          exit 0
